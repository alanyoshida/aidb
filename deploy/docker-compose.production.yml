# Portal de PRODUÇÃO sob o driver Docker (change add-production-portal-install, design D6).
#
# Só sistemas só implantação: sem agente, sem chat, sem credencial de LLM. Por isso não há
# broker de inferência, LiteLLM, banco de demonstração nem observabilidade aqui — o compose de
# desenvolvimento (docker-compose.yml) serve de referência para quem quiser acrescentar.
#
# Rode num host Docker SÓ DESTE PORTAL: o portal de produção recusa subir se o host tiver
# containers de outra instalação (homologação, por exemplo).
#
#   cp deploy/production.env.example deploy/production.env   # e preencha
#   docker compose -f deploy/docker-compose.production.yml --env-file deploy/production.env up -d --build
#
# Passo a passo completo: docs/operacao.md, "Instalar um portal de produção".
name: aidb-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appaiforge
      POSTGRES_PASSWORD: ${APPAIFORGE_POSTGRES_PASSWORD:?defina APPAIFORGE_POSTGRES_PASSWORD (senha do banco do portal)}
      POSTGRES_DB: appaiforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appaiforge"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  traefik:
    image: traefik:v3.1
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "${APPAIFORGE_HTTP_PORT:-80}:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - dynamic:/etc/traefik/dynamic
    depends_on:
      portal:
        condition: service_healthy
    restart: unless-stopped

  portal:
    build:
      context: ..
      dockerfile: deploy/portal.Dockerfile
    environment:
      APPAIFORGE_INSTALLATION_ROLE: production
      APPAIFORGE_DATABASE_URL: postgresql+psycopg://appaiforge:${APPAIFORGE_POSTGRES_PASSWORD}@postgres:5432/appaiforge
      APPAIFORGE_SECRET_KEY: ${APPAIFORGE_SECRET_KEY:?defina APPAIFORGE_SECRET_KEY (openssl rand -hex 32)}
      APPAIFORGE_DB_GATE_PROXY_SERVICE_TOKEN: ${APPAIFORGE_DB_GATE_PROXY_SERVICE_TOKEN:?defina APPAIFORGE_DB_GATE_PROXY_SERVICE_TOKEN (openssl rand -hex 32)}
      APPAIFORGE_DB_GATE_MODE: ${APPAIFORGE_DB_GATE_MODE:-enforce}
      APPAIFORGE_SEED_DEMO_ADMIN: "0"
      APPAIFORGE_INFERENCE_BROKER_ENABLED: "false"
      APPAIFORGE_DOCKER_NETWORK: aidb-prod-net
      APPAIFORGE_WORKSPACES_DIR: /workspaces
      APPAIFORGE_HOST_WORKSPACES_DIR: ${APPAIFORGE_WORKSPACES_DIR:-/opt/aidb-prod/workspaces}
      APPAIFORGE_CONFIGS_DIR: /configs
      APPAIFORGE_HOST_CONFIG_DIR: ${APPAIFORGE_CONFIGS_DIR:-/opt/aidb-prod/configs}
      APPAIFORGE_DYNAMIC_CONFIG_DIR: /dynamic
      APPAIFORGE_GITDIRS_DIR: /gitdirs
      APPAIFORGE_GIT_RELAYS_DIR: /git-relays
      APPAIFORGE_MAX_SYSTEMS: ${APPAIFORGE_MAX_SYSTEMS:-50}
      # endereço público (redirects do login) e o que o GitLab usa para o webhook
      APPAIFORGE_PUBLIC_BASE_URL: ${APPAIFORGE_PUBLIC_BASE_URL:-}
      APPAIFORGE_WEBHOOK_BASE_URL: ${APPAIFORGE_WEBHOOK_BASE_URL:-}
      APPAIFORGE_DEPLOY_POLL_INTERVAL: ${APPAIFORGE_DEPLOY_POLL_INTERVAL:-60}
      APPAIFORGE_DEPLOY_HEALTH_TIMEOUT: ${APPAIFORGE_DEPLOY_HEALTH_TIMEOUT:-90}
      APPAIFORGE_DEPLOY_HEALTH_INTERVAL: ${APPAIFORGE_DEPLOY_HEALTH_INTERVAL:-2}
      # primeiro admin: break-glass (modo local ou oidc) e/ou OIDC
      APPAIFORGE_AUTH_MODE: ${APPAIFORGE_AUTH_MODE:-local}
      APPAIFORGE_BREAKGLASS_EMAIL: ${APPAIFORGE_BREAKGLASS_EMAIL:-}
      APPAIFORGE_BREAKGLASS_PASSWORD_HASH: ${APPAIFORGE_BREAKGLASS_PASSWORD_HASH:-}
      APPAIFORGE_OIDC_ISSUER: ${APPAIFORGE_OIDC_ISSUER:-}
      APPAIFORGE_OIDC_INTERNAL_BASE_URL: ${APPAIFORGE_OIDC_INTERNAL_BASE_URL:-}
      APPAIFORGE_OIDC_CLIENT_ID: ${APPAIFORGE_OIDC_CLIENT_ID:-}
      APPAIFORGE_OIDC_CLIENT_SECRET: ${APPAIFORGE_OIDC_CLIENT_SECRET:-}
      APPAIFORGE_DISPLAY_TIMEZONE: ${APPAIFORGE_DISPLAY_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - ${APPAIFORGE_WORKSPACES_DIR:-/opt/aidb-prod/workspaces}:/workspaces
      - ${APPAIFORGE_CONFIGS_DIR:-/opt/aidb-prod/configs}:/configs
      - gitdirs:/gitdirs
      - git-relays:/git-relays
      - dynamic:/dynamic
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

networks:
  default:
    name: aidb-prod-net

volumes:
  pgdata:
  gitdirs:
  git-relays:
  dynamic:
