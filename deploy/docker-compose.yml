name: appaiforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appaiforge
      POSTGRES_PASSWORD: appaiforge
      POSTGRES_DB: appaiforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appaiforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: appaiforge
      MYSQL_USER: appaiforge
      MYSQL_PASSWORD: appaiforge
      MYSQL_ROOT_PASSWORD: rootpw
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "appaiforge", "-pappaiforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  traefik:
    image: traefik:v3.1
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "80:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - dynamic:/etc/traefik/dynamic
    depends_on:
      portal:
        condition: service_healthy

  portal:
    build:
      context: ..
      dockerfile: deploy/portal.Dockerfile
    environment:
      APPAIFORGE_DATABASE_URL: postgresql+psycopg://appaiforge:appaiforge@postgres:5432/appaiforge
      APPAIFORGE_SECRET_KEY: ${APPAIFORGE_SECRET_KEY:-change-me-in-production}
      APPAIFORGE_DOCKER_NETWORK: appaiforge-net
      APPAIFORGE_WORKSPACES_DIR: /workspaces
      APPAIFORGE_HOST_WORKSPACES_DIR: ${APPAIFORGE_WORKSPACES_DIR:-/opt/appaiforge/workspaces}
      APPAIFORGE_CONFIGS_DIR: /configs
      APPAIFORGE_HOST_CONFIG_DIR: ${APPAIFORGE_CONFIGS_DIR:-/opt/appaiforge/configs}
      APPAIFORGE_DYNAMIC_CONFIG_DIR: /dynamic
      APPAIFORGE_HARNESS_MODE: ${APPAIFORGE_HARNESS_MODE:-fake}
      APPAIFORGE_INFERENCE_BROKER_ENABLED: ${APPAIFORGE_INFERENCE_BROKER_ENABLED:-false}
      APPAIFORGE_LITELLM_BASE_URL: http://litellm:4000
      APPAIFORGE_LITELLM_API_KEY: ${APPAIFORGE_LITELLM_API_KEY:-sk-aidb-dev}
      APPAIFORGE_INFERENCE_BROKER_URL: http://broker:4001
      APPAIFORGE_INFERENCE_BROKER_SERVICE_TOKEN: ${APPAIFORGE_INFERENCE_BROKER_SERVICE_TOKEN:-troque-este-token}
      # Gate de banco no data plane (etapa 4 do confinamento). "shadow": classifica
      # e audita sem bloquear (default, até o spike S5 fechar); "enforce": aplica
      # a decisão (etapa 7). Mesmo padrão de segredo compartilhado do broker.
      APPAIFORGE_DB_GATE_MODE: ${APPAIFORGE_DB_GATE_MODE:-enforce}
      APPAIFORGE_DB_GATE_PROXY_SERVICE_TOKEN: ${APPAIFORGE_DB_GATE_PROXY_SERVICE_TOKEN:-troque-este-token}
      APPAIFORGE_FAKE_DELAY: ${APPAIFORGE_FAKE_DELAY:-1.5}
      APPAIFORGE_MAX_SYSTEMS: ${APPAIFORGE_MAX_SYSTEMS:-50}
      APPAIFORGE_SEED_DEMO_ADMIN: "1"
      # Telemetria OTel (change agent-telemetry-otel / agent-telemetry-backend-agnostic):
      # vazio por padrão — o SDK fica no-op. Aponta sempre para o Collector
      # (nunca direto para um backend específico) - a escolha de Tempo/Loki
      # vs. Elastic (ou outro) é configuração do Collector, nunca da
      # aplicação (nenhuma das variáveis tem valor fixo aqui de propósito:
      # subir um profile sem definir as variáveis não deve gerar nenhuma
      # tentativa de exportação).
      APPAIFORGE_OTEL_TRACES_ENDPOINT: ${APPAIFORGE_OTEL_TRACES_ENDPOINT:-}
      APPAIFORGE_OTEL_LOGS_ENDPOINT: ${APPAIFORGE_OTEL_LOGS_ENDPOINT:-}
      APPAIFORGE_OTEL_SPAN_RETENTION_DAYS: ${APPAIFORGE_OTEL_SPAN_RETENTION_DAYS:-30}
    volumes:
      - ${APPAIFORGE_WORKSPACES_DIR:-/opt/appaiforge/workspaces}:/workspaces
      - ${APPAIFORGE_CONFIGS_DIR:-/opt/appaiforge/configs}:/configs
      - dynamic:/dynamic
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${APPAIFORGE_LITELLM_API_KEY:-sk-aidb-dev}
      DATABASE_URL: postgresql://appaiforge:appaiforge@postgres:5432/litellm
      AIDB_USAGE_ENDPOINT: http://portal:8080/internal/inference/usage
      AIDB_USAGE_TOKEN: ${APPAIFORGE_INFERENCE_BROKER_SERVICE_TOKEN:-troque-este-token}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/custom_callbacks.py:/app/custom_callbacks.py:ro

  broker:
    build:
      context: ..
      dockerfile: deploy/portal.Dockerfile
    command: ["uvicorn", "appaiforge.broker_app:app", "--host", "0.0.0.0", "--port", "4001"]
    environment:
      APPAIFORGE_LITELLM_BASE_URL: http://litellm:4000
      APPAIFORGE_LITELLM_API_KEY: ${APPAIFORGE_LITELLM_API_KEY:-sk-aidb-dev}
      APPAIFORGE_PORTAL_INTERNAL_URL: http://portal:8080
      APPAIFORGE_INFERENCE_BROKER_SERVICE_TOKEN: ${APPAIFORGE_INFERENCE_BROKER_SERVICE_TOKEN:-troque-este-token}
      APPAIFORGE_INFERENCE_BROKER_ALLOWED_HOSTS: litellm
      APPAIFORGE_SECRET_KEY: ${APPAIFORGE_SECRET_KEY:-change-me-in-production}
      # Mesmo toggle do portal (ver comentário lá) — sempre o Collector, vazio por padrão.
      APPAIFORGE_OTEL_TRACES_ENDPOINT: ${APPAIFORGE_OTEL_TRACES_ENDPOINT:-}
    depends_on:
      - litellm
      - portal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # OTel Collector: único endpoint fixo que portal/broker conhecem
  # (APPAIFORGE_OTEL_TRACES_ENDPOINT/LOGS_ENDPOINT), independente de qual
  # backend está por trás (change agent-telemetry-backend-agnostic). Os
  # dois serviços abaixo compartilham o mesmo alias de rede `otel-collector`
  # - só um dos dois profiles deve estar de pé por vez; qual exporta pra
  # onde é definido pelo arquivo de config que cada um monta, não pela app.
  otel-collector-tempo:
    image: otel/opentelemetry-collector-contrib:0.112.0
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-tempo.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      default:
        aliases:
          - otel-collector
    depends_on:
      - tempo
      - loki

  otel-collector-elastic:
    image: otel/opentelemetry-collector-contrib:0.112.0
    profiles: ["observability-elastic"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-elastic.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      default:
        aliases:
          - otel-collector
    depends_on:
      - apm-server

  # Stack de observabilidade opcional (change agent-telemetry-otel):
  # nenhum destes 4 serviços sobe por padrão — só com `--profile
  # observability`. portal/broker/litellm nunca entram em nenhum profile,
  # continuam sempre ligados como hoje (ver proposal.md/design.md).
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo

  loki:
    image: grafana/loki:3.2.1
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki

  # Stack de exemplo Elastic (change agent-telemetry-backend-agnostic):
  # segundo backend de observabilidade pronto, alimentado pelo mesmo
  # Collector (otel-collector-elastic acima) - prova que troca de backend
  # não exige mudança na aplicação. Opt-in via `--profile observability-elastic`,
  # nunca sobe junto com o profile `observability` por padrão.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ["observability-elastic"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearchdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["observability-elastic"]
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.15.3
    profiles: ["observability-elastic"]
    command:
      - apm-server
      - -e
      - -E
      - apm-server.host=0.0.0.0:8200
      - -E
      - output.elasticsearch.hosts=["elasticsearch:9200"]
      - -E
      - apm-server.kibana.enabled=true
      - -E
      - apm-server.kibana.host=http://kibana:5601
    depends_on:
      - elasticsearch
      - kibana

networks:
  default:
    name: appaiforge-net

volumes:
  pgdata:
  mysqldata:
  dynamic:
  prometheusdata:
  tempodata:
  lokidata:
  grafanadata:
  elasticsearchdata:
