# Deployment + Service do próprio portal dentro do cluster — só faz sentido
# quando o driver de provisionamento ativo é Kubernetes; o docker-compose de
# produção (driver Docker) não tem nenhuma relação com isto.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appaiforge-portal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "appaiforge-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: portal
  template:
    metadata:
      labels:
        {{- include "appaiforge-portal.labels" . | nindent 8 }}
        app.kubernetes.io/component: portal
    spec:
      serviceAccountName: {{ include "appaiforge-portal.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.portal.migrateOnStart }}
      # Migrações do banco com a imagem NOVA antes de o portal subir (change
      # add-production-portal-install): numa atualização, o portal novo depende das colunas que
      # a migração cria. Se o Postgres ainda não estiver pronto, o initContainer falha e o
      # Kubernetes tenta de novo.
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app/portal
          command: ["alembic", "upgrade", "head"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "appaiforge-portal.secretName" . }}
                  key: postgresPassword
            - name: APPAIFORGE_DATABASE_URL
              value: postgresql+psycopg://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ include "appaiforge-portal.postgres.fullname" . }}:5432/{{ .Values.postgres.database }}
            - name: APPAIFORGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "appaiforge-portal.secretName" . }}
                  key: secretKey
      {{- end }}
      containers:
        - name: portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            # Precisa vir antes de APPAIFORGE_DATABASE_URL: a interpolação
            # $(POSTGRES_PASSWORD) do Kubernetes só resolve env vars já
            # definidas mais acima na mesma lista.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "appaiforge-portal.secretName" . }}
                  key: postgresPassword
            - name: APPAIFORGE_DATABASE_URL
              value: postgresql+psycopg://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ include "appaiforge-portal.postgres.fullname" . }}:5432/{{ .Values.postgres.database }}
            - name: APPAIFORGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "appaiforge-portal.secretName" . }}
                  key: secretKey
            - name: APPAIFORGE_PROVISIONING_DRIVER
              value: {{ .Values.portal.provisioningDriver | quote }}
            - name: APPAIFORGE_K8S_NAMESPACE
              value: {{ include "appaiforge-portal.systemsNamespace" . | quote }}
            # Nenhum APPAIFORGE_K8S_KUBECONFIG_CONTEXT aqui de propósito: rodando
            # dentro do cluster, _load_kube_config() usa a identidade do próprio
            # Pod (load_incluster_config()) antes de qualquer kubeconfig.
            - name: APPAIFORGE_HARNESS_MODE
              value: {{ .Values.portal.harnessMode | quote }}
            - name: APPAIFORGE_CONFIGS_DIR
              value: {{ .Values.portal.configsDir | quote }}
            - name: APPAIFORGE_GIT_RELAYS_DIR
              value: /git-relays
            # Broker de inferência (ADR 0020) não é implantado por este chart —
            # mesmo default "false" dos manifests originais.
            - name: APPAIFORGE_INFERENCE_BROKER_ENABLED
              value: "false"
            - name: APPAIFORGE_DB_GATE_MODE
              value: {{ .Values.portal.dbGate.mode | quote }}
            - name: APPAIFORGE_DB_GATE_PROXY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "appaiforge-portal.secretName" . }}
                  key: dbGateProxyServiceToken
            # DNS do Service do próprio portal (abaixo) — usado pelos sidecars
            # dbgate de cada sistema pra chamar de volta o portal e pelo forwardAuth
            # das rotas /apps/<slug>; o default de settings.portal_internal_url
            # ("http://portal:8080") é o hostname da rede Docker, não resolve aqui.
            # Nome completo (svc.cluster.local): o forwardAuth é chamado pelo Traefik,
            # que roda em outro namespace, onde o nome curto não resolve.
            - name: APPAIFORGE_PORTAL_INTERNAL_URL
              value: http://{{ include "appaiforge-portal.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}
            # main.py:_seed_demo_admin() compara com a string exata "1", não um
            # bool qualquer — por isso o ternário em vez de `| quote` direto.
            - name: APPAIFORGE_SEED_DEMO_ADMIN
              value: {{ ternary "1" "0" .Values.portal.seedDemoAdmin | quote }}
            # Autenticação (change add-oidc-sso).
            - name: APPAIFORGE_AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            - name: APPAIFORGE_PUBLIC_BASE_URL
              value: {{ .Values.auth.publicBaseUrl | quote }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: APPAIFORGE_OIDC_ISSUER
              value: {{ required "auth.oidc.issuer é obrigatório com auth.mode=oidc" .Values.auth.oidc.issuer | quote }}
            - name: APPAIFORGE_OIDC_CLIENT_ID
              value: {{ required "auth.oidc.clientId é obrigatório com auth.mode=oidc" .Values.auth.oidc.clientId | quote }}
            - name: APPAIFORGE_OIDC_INTERNAL_BASE_URL
              value: {{ .Values.auth.oidc.internalBaseUrl | quote }}
            - name: APPAIFORGE_OIDC_SCOPES
              value: {{ .Values.auth.oidc.scopes | quote }}
            - name: APPAIFORGE_OIDC_ROLES_CLAIM
              value: {{ .Values.auth.oidc.rolesClaim | quote }}
            - name: APPAIFORGE_OIDC_GROUPS_CLAIM
              value: {{ .Values.auth.oidc.groupsClaim | quote }}
            - name: APPAIFORGE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "appaiforge-portal.secretName" . }}
                  key: oidcClientSecret
            {{- end }}
            {{- if .Values.auth.breakglass.email }}
            - name: APPAIFORGE_BREAKGLASS_EMAIL
              value: {{ .Values.auth.breakglass.email | quote }}
            - name: APPAIFORGE_BREAKGLASS_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ include "appaiforge-portal.secretName" . }}
                  key: breakglassPasswordHash
            {{- end }}
            {{- include "appaiforge-portal.validateProduction" . }}
            {{- if ne .Values.portal.installationRole "development" }}
            # Papel da instalação (change add-production-portal-install, D4); só aparece fora do
            # padrão, para a renderização de desenvolvimento continuar idêntica.
            - name: APPAIFORGE_INSTALLATION_ROLE
              value: {{ .Values.portal.installationRole | quote }}
            {{- end }}
            {{- if .Values.portal.baseImage }}
            - name: APPAIFORGE_BASE_IMAGE
              value: {{ .Values.portal.baseImage | quote }}
            {{- end }}
            {{- if .Values.portal.claudeCodeImage }}
            - name: APPAIFORGE_CLAUDE_CODE_IMAGE
              value: {{ .Values.portal.claudeCodeImage | quote }}
            {{- end }}
            {{- with .Values.portal.systemImagePullSecrets }}
            {{- /* aceita nomes (["registro"]) e o formato do Kubernetes ([{name: registro}]) */}}
            {{- $names := list }}
            {{- range . }}
            {{- if kindIs "map" . }}
            {{- $names = append $names .name }}
            {{- else }}
            {{- $names = append $names . }}
            {{- end }}
            {{- end }}
            - name: APPAIFORGE_K8S_IMAGE_PULL_SECRETS
              value: {{ join "," $names | quote }}
            {{- end }}
            {{- if .Values.portal.webhookBaseUrl }}
            - name: APPAIFORGE_WEBHOOK_BASE_URL
              value: {{ .Values.portal.webhookBaseUrl | quote }}
            {{- end }}
            {{- if eq .Values.portal.installationRole "production" }}
            - name: APPAIFORGE_DEPLOY_POLL_INTERVAL
              value: {{ .Values.portal.deploy.pollInterval | quote }}
            - name: APPAIFORGE_DEPLOY_HEALTH_TIMEOUT
              value: {{ .Values.portal.deploy.healthTimeout | quote }}
            - name: APPAIFORGE_DEPLOY_HEALTH_INTERVAL
              value: {{ .Values.portal.deploy.healthInterval | quote }}
            {{- end }}
            - name: APPAIFORGE_MAX_SYSTEMS
              value: {{ .Values.portal.maxSystems | quote }}
            - name: APPAIFORGE_FAKE_DELAY
              value: {{ .Values.portal.fakeDelay | quote }}
            {{- with .Values.portal.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: configs-scratch
              mountPath: /configs
            # Cópias de retransmissão para o repositório remoto de cada sistema (change
            # add-system-git-remote): cache reconstruível, só do portal.
            - name: git-relays
              mountPath: /git-relays
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        # Staging local antes do ConfigMap (_upsert_config_map) — emptyDir,
        # efêmero de propósito.
        - name: configs-scratch
          emptyDir: {}
        - name: git-relays
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "appaiforge-portal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "appaiforge-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: portal
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
