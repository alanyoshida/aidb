{{- if .Values.rbac.create }}
# Exatamente as operações que portal/appaiforge/drivers/kubernetes_driver.py e
# portal/appaiforge/checkpoints.py (_git_via_exec) fazem via API, nem mais nem
# menos — verificado com `kubectl auth can-i --as=system:serviceaccount:<ns>:<sa>`
# para cada verbo/recurso abaixo (ver openspec/changes/archive/2026-11-14-deploy-portal-in-cluster/portal-rbac.yaml,
# origem destes manifests).
#
# Role e RoleBinding ficam no namespace dos SISTEMAS (portal.systemsNamespace, ou o da
# release quando vazio): todas as operações abaixo são sobre recursos de sistema, e uma Role
# só vale no namespace onde é criada. Com um systemsNamespace diferente do da release, esse
# namespace precisa existir antes do `helm install` (o Helm não cria objetos num namespace
# inexistente, e o chart não o cria para que um `helm uninstall` não apague os sistemas).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "appaiforge-portal.fullname" . }}
  namespace: {{ include "appaiforge-portal.systemsNamespace" . }}
  labels:
    {{- include "appaiforge-portal.labels" . | nindent 4 }}
rules:
  # provision()/remove()/reconcile_one()/is_healthy(): create_namespaced_pod,
  # delete_namespaced_pod (_delete_pod_if_exists), read_namespaced_pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "create", "delete"]
  # git_backend (KubernetesGitBackend, exec no container `git` do pod) e
  # write_workspace_files -> connect_get_namespaced_pod_exec faz upgrade de
  # WebSocket via GET (não a rota SPDY baseada em POST que `kubectl exec` usa) —
  # o apiserver autoriza pelo verbo HTTP real da requisição, por isso "get".
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get"]
  # _ensure_workspace_pvc / _ensure_gitdir_pvc: read_namespaced_persistent_volume_claim,
  # create_namespaced_...; delete_workspace_pvc / delete_gitdir_pvc (exclusão definitiva):
  # delete_namespaced_persistent_volume_claim.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create", "delete"]
  # _upsert_config_map / remove(): delete_namespaced_config_map, create_namespaced_config_map.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete"]
  # publish()/unpublish(): replace_namespaced_service (fallback create se 404),
  # delete_namespaced_service.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "update", "delete"]
  # publish()/unpublish() via _upsert_custom: create_namespaced_custom_object,
  # delete_namespaced_custom_object, para os CRDs do Traefik (Middleware
  # stripPrefix + IngressRoute).
  - apiGroups: ["traefik.io"]
    resources: ["middlewares", "ingressroutes"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "appaiforge-portal.fullname" . }}
  namespace: {{ include "appaiforge-portal.systemsNamespace" . }}
  labels:
    {{- include "appaiforge-portal.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "appaiforge-portal.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "appaiforge-portal.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.rbac.clusterScoped }}
---
# ensure_ready() lê/cria o próprio namespace (read_namespace/create_namespace) —
# único recurso CLUSTER-scoped que o driver toca, por isso em
# ClusterRole/ClusterRoleBinding separados do resto (tudo namespaced, acima).
# Desligue com `rbac.clusterScoped=false` se preferir criar o namespace dos
# sistemas manualmente e não conceder isto ao ServiceAccount do portal.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "appaiforge-portal.fullname" . }}-namespaces
  labels:
    {{- include "appaiforge-portal.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "appaiforge-portal.fullname" . }}-namespaces
  labels:
    {{- include "appaiforge-portal.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "appaiforge-portal.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "appaiforge-portal.fullname" . }}-namespaces
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
