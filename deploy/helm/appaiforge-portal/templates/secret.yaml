{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appaiforge-portal.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "appaiforge-portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  secretKey: {{ .Values.secrets.secretKey | quote }}
  dbGateProxyServiceToken: {{ .Values.secrets.dbGateProxyServiceToken | quote }}
  postgresPassword: {{ .Values.secrets.postgresPassword | quote }}
  oidcClientSecret: {{ .Values.secrets.oidcClientSecret | quote }}
  breakglassPasswordHash: {{ .Values.secrets.breakglassPasswordHash | quote }}
{{- end }}
