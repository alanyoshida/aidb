# Valores default calibrados para o cluster kind de validação local (ver
# openspec/changes/archive/2026-11-11-add-kubernetes-driver/kind-cluster.yaml e
# openspec/changes/archive/2026-11-14-deploy-portal-in-cluster/). Nunca use os
# defaults de senha/token/secretKey abaixo num cluster que não seja descartável.

# -- Nome usado para os recursos (Deployment, Service, StatefulSet, ...). Deixe
# vazio para derivar de .Release.Name (ver templates/_helpers.tpl). Mantenha o
# default "appaiforge-portal" se quiser paridade 1:1 com os manifests antigos.
nameOverride: ""
fullnameOverride: "appaiforge-portal"

image:
  repository: appaiforge/portal
  tag: "1.13.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources: {}
# Exemplo:
#   requests: { cpu: 100m, memory: 256Mi }
#   limits: { cpu: "1", memory: 512Mi }

nodeSelector: {}
tolerations: []
affinity: {}

# RBAC exatamente do tamanho que portal/appaiforge/drivers/kubernetes_driver.py e
# checkpoints.py precisam (ver comentários de templates/rbac.yaml).
rbac:
  create: true
  # `namespaces` (get/create) é o único recurso cluster-scoped que o driver toca
  # (ensure_ready()). Desligue se preferir criar o namespace manualmente antes do
  # install e não conceder ClusterRole/ClusterRoleBinding ao ServiceAccount do portal.
  clusterScoped: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Segredos do portal. Por padrão o chart cria um Secret com os valores de
# `secrets.*` abaixo (dev only). Em produção, defina `secrets.existingSecret`
# com o nome de um Secret já criado fora do Helm, com as mesmas chaves
# (secretKey, dbGateProxyServiceToken, postgresPassword) — os valores em
# `secrets.*` são ignorados nesse caso.
secrets:
  existingSecret: ""
  secretKey: "change-me-in-production"
  dbGateProxyServiceToken: "troque-este-token"
  postgresPassword: "appaiforge"
  # Change add-oidc-sso — chaves opcionais (vazio = não usado). Com existingSecret,
  # inclua `oidcClientSecret` e/ou `breakglassPasswordHash` no Secret externo.
  oidcClientSecret: ""
  # Hash de `appaiforge hash-password` (sem escapar o $: aqui não há interpolação).
  breakglassPasswordHash: ""

# Autenticação (change add-oidc-sso). "local" (e-mail/senha) ou "oidc" (SSO contra
# IdP externo — o chart não implanta IdP). O modo fica gravado na base no primeiro
# boot; trocar depois faz o portal recusar subir.
auth:
  mode: local
  # URL pública do portal, como o navegador a vê (base do redirect_uri do OIDC).
  publicBaseUrl: ""
  oidc:
    issuer: ""
    clientId: ""
    # Base interna do IdP para chamadas servidor-a-servidor, quando o Pod não
    # alcança o endereço público (vazio = usa o emissor).
    internalBaseUrl: ""
    scopes: "openid email profile"
    rolesClaim: "realm_access.roles"
    groupsClaim: "groups"
  # Admin de emergência (os dois modos); a senha vem de secrets.breakglassPasswordHash.
  breakglass:
    email: ""

portal:
  # Driver de provisionamento ativo. Este chart só faz sentido com "kubernetes";
  # fica configurável só para não esconder a env var por trás de um valor fixo
  # (o portal lê APPAIFORGE_PROVISIONING_DRIVER como qualquer outra config).
  provisioningDriver: kubernetes

  # Namespace onde os Pods de sistema são provisionados. Vazio = mesmo
  # namespace da release (.Release.Namespace), igual ao que os manifests
  # antigos faziam (portal e sistemas no namespace "appaiforge"). A Role do
  # portal é criada neste namespace; se for outro, ele precisa existir antes do
  # `helm install` e ser só deste portal.
  systemsNamespace: ""

  # "fake" (default, igual ao docker-compose) não chama LLM nenhum; troque para
  # "opencode" para chat real com o agente.
  harnessMode: fake

  seedDemoAdmin: true

  # Papel da instalação (change add-deploy-only-system / add-production-portal-install):
  # "development" (padrão) aceita sistemas com agente e só implantação; "production" só
  # aceita sistemas só implantação. Com "production", o chart exige seedDemoAdmin=false e
  # secrets.existingSecret, e cada portal precisa do seu próprio namespace de sistemas.
  installationRole: development

  # Roda `alembic upgrade head` num initContainer, com a imagem nova, antes de cada subida do
  # portal. Ligue numa instalação nova (o banco nasce pelas migrações). Não ligue num banco
  # criado antes sem Alembic: as migrações tentariam recriar as tabelas e o initContainer falharia.
  migrateOnStart: false

  # Endereço do portal como o GitLab o vê, mostrado na aba Implantação para o webhook
  # (vazio = auth.publicBaseUrl).
  webhookBaseUrl: ""

  # Imagem dos Pods de sistema (vazio = padrão do portal, appaiforge/base:1.13.0). Num cluster
  # real, a do seu registro, ex.: registro.exemplo.com/appaiforge/base:1.4.2. Com registro
  # privado, liste o Secret de pull em systemImagePullSecrets.
  baseImage: ""

  # Imagem dos sistemas com o perfil de agente claude-code (vazio = appaiforge/claude-code:1.13.0).
  claudeCodeImage: ""

  # Secrets de pull dos Pods de sistema (registro privado). Precisam existir no namespace dos
  # sistemas. Aceita nomes ([registro-credenciais]) ou o formato do imagePullSecrets do
  # Kubernetes ([{name: registro-credenciais}]).
  systemImagePullSecrets: []

  # Implantação de versões dos sistemas só implantação (só vale com installationRole=production).
  deploy:
    # segundos entre as consultas de tags novas no modo automático
    pollInterval: 60
    # prazo, em segundos, para a versão nova responder em três checagens seguidas
    healthTimeout: 90
    # segundos entre essas checagens
    healthInterval: 2

  configsDir: /configs

  dbGate:
    mode: enforce

  # Broker de inferência (ADR 0020) não é implantado por este chart (os manifests
  # originais também não o incluíam) — a chave APPAIFORGE_INFERENCE_BROKER_ENABLED fica fixa
  # em "false" no template. Telemetria: ver `observability`, no fim deste arquivo.

  maxSystems: 50
  fakeDelay: 1.5

  extraEnv: []
  # Exemplo:
  #   - name: APPAIFORGE_DISPLAY_TIMEZONE
  #     value: America/Sao_Paulo

# Modo de roteamento das rotas /apps/<slug> e da rota do portal (change
# gateway-api-traefik-subchart, D0). Transitório: convivem nesta versão e o "ingressroute" sai numa
# change seguinte.
#   ingressroute (padrão): IngressRoute + Middleware do Traefik, como nas versões anteriores.
#   gateway: HTTPRoute da Gateway API, ligado ao Gateway (deste chart ou `gateway.existing`).
# Trocar o modo republica as rotas de todos os sistemas no boot seguinte do portal, sem recriar Pods.
routing:
  mode: ingressroute

# Traefik como subchart (D3): controlador de entrada nos dois modos e implementação da Gateway API
# no modo gateway. Desligue (traefik.enabled=false) se o cluster já tiver um Traefik — no modo
# gateway, informe então o Gateway dele em `gateway.existing`. Os valores abaixo vão direto para o
# chart traefik/traefik (ver VALUES.md dele); os providers e o GatewayClass são os que o portal
# precisa e valem para os dois modos.
traefik:
  enabled: true
  providers:
    kubernetesIngress:
      enabled: false
    # IngressRoute e Middleware (o forwardAuth das apps é Middleware nos dois modos)
    kubernetesCRD:
      enabled: true
    # HTTPRoute/Gateway; os CRDs da Gateway API vêm em crds/ deste chart (D4)
    kubernetesGateway:
      enabled: true
  # o Gateway é deste chart (templates/gateway.yaml), não o padrão do subchart
  gateway:
    enabled: false
  # GatewayClass "traefik", usado pelo Gateway deste chart
  gatewayClass:
    enabled: true
  # Traços e métricas OTLP do Traefik para o Collector deste chart (change
  # chart-observability-otel, D4). Desligados; para ligar, `observability.enabled=true` e
  # `traefik.tracing.otlp.enabled=true` + `traefik.tracing.otlp.http.enabled=true` (o mesmo em
  # `traefik.metrics.otlp`). Os valores do subchart não aceitam template: o endpoint já vem com o
  # Service do Collector no `fullnameOverride` padrão (mesmo namespace do Traefik); com outro
  # nome, ajuste-o — o chart recusa renderizar com um endpoint que não aponte para o Collector.
  # A query string sai mascarada nos traços (padrão do Traefik, `safeQueryParams: []`).
  tracing:
    otlp:
      enabled: false
      http:
        enabled: false
        endpoint: http://appaiforge-portal-otel-collector:4318/v1/traces
  metrics:
    otlp:
      enabled: false
      http:
        enabled: false
        endpoint: http://appaiforge-portal-otel-collector:4318/v1/metrics

# Gateway das rotas no modo gateway.
gateway:
  # Portas dos listeners do Gateway criado por este chart (modo gateway com traefik.enabled). Têm
  # de ser as portas dos entrypoints do Traefik (traefik.ports.web.port / .websecure.port; 8000 e
  # 8443 no padrão do subchart), não as portas expostas pelo Service dele.
  listenerPorts:
    web: 8000
    websecure: 8443
  # Gateway já existente no cluster, obrigatório no modo gateway com traefik.enabled=false.
  existing:
    name: ""
    namespace: ""

# Rota do próprio portal (change add-production-portal-install, D5), para usuários e para o
# webhook do GitLab. Desligada por padrão (acesso por port-forward). Não captura as rotas
# /apps/<slug> dos sistemas: no modo ingressroute pela prioridade 1; no modo gateway porque o
# portal recebe este host e as rotas dos sistemas usam o mesmo.
portalRoute:
  enabled: false
  # host público do portal (obrigatório com enabled=true), ex.: aidb-prod.exemplo.com
  host: ""
  # só no modo ingressroute; no modo gateway a rota fica nos listeners do Gateway
  entryPoints:
    - web
  # Secret TLS opcional. Modo ingressroute: tls.secretName da IngressRoute. Modo gateway com o
  # Gateway deste chart: certificado do listener HTTPS (o Secret fica no namespace da release).
  # Com `gateway.existing`, o TLS é do Gateway existente e este valor não é usado.
  tlsSecretName: ""

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
  user: appaiforge
  database: appaiforge
  resources: {}
  # Sem flag para desligar: a spec container-driver-kubernetes exige que os
  # dados operacionais do portal sobrevivam à recriação do Pod (ver
  # openspec/specs/container-driver-kubernetes/spec.md), por isso o PVC
  # abaixo é sempre criado.
  persistence:
    size: 1Gi
    storageClassName: ""

# Observabilidade (change chart-observability-otel, ADR 0034). Desligada por padrão: sem ela o
# chart não cria Collector e o portal não exporta nada. Ligada, o chart sobe um OTel Collector que
# recebe OTLP do portal e do Traefik e repassa a um destino OTLP externo (ADR 0025: o portal só
# conhece o Collector). O destino de referência é um APM Server do Elastic, mas nada aqui é
# específico dele.
observability:
  enabled: false
  # deployment.environment da telemetria (ex.: producao); vazio = não enviado
  environment: ""
  collector:
    # false = não criar Collector e usar um que já exista no cluster (collector.endpoint)
    create: true
    # base OTLP/HTTP de um Collector existente (só com create=false), ex.:
    # http://otel-collector.observabilidade.svc.cluster.local:4318
    endpoint: ""
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.112.0"
    resources: {}
    # Configuração completa do Collector (YAML em texto) que substitui a gerada, para outro
    # backend ou outro pipeline. As variáveis EXPORTER_TOKEN e EXPORTER_AUTHORIZATION continuam
    # disponíveis quando há exporter.existingSecret.
    config: ""
  exporter:
    # destino OTLP gRPC, ex.: apm.exemplo.com:8200 (APM Server)
    endpoint: ""
    # true = sem TLS (APM Server de teste sem certificado)
    insecure: false
    # converte métricas cumulativas para delta antes de exportar, o que o APM Server trata melhor;
    # desligue para um backend que espere cumulativo
    deltaMetrics: true
    # Secret criado fora do Helm, lido só pelo Collector central. Vazio = sem autenticação e com
    # a CA do sistema. Quais chaves dele usar fica explícito abaixo: uma chave ausente no Secret
    # faria o Collector mandar um cabeçalho vazio ou procurar uma CA que não existe.
    existingSecret: ""
    # usa a chave `token` (secret_token ou API key do APM Server) no cabeçalho Authorization
    token: true
    # Bearer (secret_token do APM Server) ou ApiKey (API key do Elastic)
    authScheme: Bearer
    # usa a chave `ca.crt` como CA do destino (certificado de CA privada)
    ca: false
  # CPU e memória dos Pods do portal e dos sistemas, lidas do kubelet de cada nó por um Collector
  # em DaemonSet. Cria o único ClusterRole do chart fora dos namespaces: get em nodes/stats e nodes.
  kubeletstats:
    enabled: false
    # o kubelet do kind usa certificado autoassinado; num cluster gerenciado, deixe false
    insecureSkipVerify: false
    collectionInterval: 30s
    resources: {}
