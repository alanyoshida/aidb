# Exemplo de valores para um portal de PRODUÇÃO (change add-production-portal-install).
# Use junto com o values.yaml padrão:
#
#   helm install aidb-prod deploy/helm/appaiforge-portal \
#     --namespace aidb-prod --create-namespace \
#     -f deploy/helm/appaiforge-portal/values-production.yaml
#
# Antes, crie o Secret com as chaves secretKey, dbGateProxyServiceToken, postgresPassword
# e breakglassPasswordHash (ver docs/operacao.md, "Instalar um portal de produção").

fullnameOverride: aidb-prod-portal

secrets:
  # Secret criado fora do Helm: produção nunca usa os valores de dev de secrets.*
  existingSecret: aidb-prod-portal-secrets

auth:
  mode: local
  # endereço público do portal, como o navegador o vê
  publicBaseUrl: "https://aidb-prod.exemplo.com"
  # admin de emergência; o hash vem do Secret (chave breakglassPasswordHash)
  breakglass:
    email: "admin@exemplo.com"

image:
  # imagem do portal no seu registro, na versão que vai instalar
  repository: appaiforge/portal
  tag: "1.12.0"

portal:
  installationRole: production
  # imagem dos Pods de sistema no seu registro (vazio = appaiforge/base:1.12.0)
  baseImage: ""
  # Secret de pull dos Pods de sistema, se o registro for privado (criado no namespace dos sistemas)
  systemImagePullSecrets: []
  # instalação nova: o banco nasce pelas migrações, aplicadas antes de cada subida
  migrateOnStart: true
  # produção não semeia admin@appaiforge.local / admin123
  seedDemoAdmin: false
  # Vazio: os Pods de sistema ficam no namespace da release (aidb-prod), que é só deste portal.
  # Para separá-los (quotas, NetworkPolicies), use um namespace próprio, criado antes do
  # `helm install` e não compartilhado com outro portal: dois portais no mesmo namespace de
  # sistemas disputariam os mesmos Pods.
  systemsNamespace: ""
  # endereço do portal como o GitLab o vê (aba Implantação → webhook)
  webhookBaseUrl: "https://aidb-prod.exemplo.com"
  deploy:
    pollInterval: 60
    healthTimeout: 90
    healthInterval: 2

# Modo de roteamento: ingressroute (padrão desta versão) ou gateway (Gateway API). Ver o README do
# chart, "Roteamento". Trocar republica as rotas dos sistemas no boot seguinte, sem recriar Pods.
routing:
  mode: ingressroute

# O chart instala o Traefik (subchart). Se o cluster já tem um Traefik, desligue e, no modo
# gateway, informe o Gateway dele em gateway.existing.
traefik:
  enabled: true

portalRoute:
  enabled: true
  host: aidb-prod.exemplo.com
  # só no modo ingressroute
  entryPoints:
    - web
  # Secret do certificado. Modo ingressroute: com entryPoints [websecure]. Modo gateway: vira o
  # listener HTTPS do Gateway deste chart (o Secret fica no namespace da release).
  tlsSecretName: ""
