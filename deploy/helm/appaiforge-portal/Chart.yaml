apiVersion: v2
name: appaiforge-portal
description: >-
  Portal AIDB (FastAPI + NiceGUI) e seu Postgres rodando dentro de um cluster
  Kubernetes, sob o driver de provisionamento Kubernetes (capability
  container-driver-kubernetes). Equivalente em Helm aos manifests aplicados
  manualmente em openspec/changes/archive/2026-11-14-deploy-portal-in-cluster/.
type: application
version: 1.12.0
appVersion: "1.12.0"
keywords:
  - appaiforge
  - aidb
  - nicegui
# Traefik como controlador de entrada e implementação da Gateway API (change
# gateway-api-traefik-subchart, D3). Desligável com traefik.enabled=false para um cluster que já
# tem um Traefik. O pacote fica versionado em charts/ (com Chart.lock) para `helm template` e o
# teste do chart funcionarem sem rede (D7). Atualizar a versão é uma change própria.
dependencies:
  - name: traefik
    version: 42.3.2
    repository: https://traefik.github.io/charts
    condition: traefik.enabled
