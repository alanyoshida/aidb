name: appaiforge-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appaiforge
      POSTGRES_PASSWORD: appaiforge
      POSTGRES_DB: appaiforge
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./e2e-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appaiforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  bigquery-emulator:
    image: ghcr.io/goccy/bigquery-emulator:0.8.1
    command: ["--project=bq-test", "--dataset=e2e", "--port=9050"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: appaiforge
      MYSQL_USER: appaiforge
      MYSQL_PASSWORD: appaiforge
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appaiforge", "-pappaiforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  traefik:
    image: traefik:v3.1
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "8081:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - dynamic:/etc/traefik/dynamic
    depends_on:
      portal:
        condition: service_healthy

  portal:
    build:
      context: ..
      dockerfile: deploy/portal.Dockerfile
    environment:
      APPAIFORGE_DATABASE_URL: postgresql+psycopg://appaiforge:appaiforge@postgres:5432/appaiforge
      APPAIFORGE_SECRET_KEY: e2e-secret
      APPAIFORGE_DOCKER_NETWORK: appaiforge-e2e-net
      APPAIFORGE_WORKSPACES_DIR: /workspaces
      APPAIFORGE_HOST_WORKSPACES_DIR: ${APPAIFORGE_E2E_WORKSPACES_DIR:-/opt/appaiforge/workspaces-e2e}
      APPAIFORGE_CONFIGS_DIR: /configs
      APPAIFORGE_HOST_CONFIG_DIR: ${APPAIFORGE_E2E_CONFIGS_DIR:-/opt/appaiforge/configs-e2e}
      APPAIFORGE_DYNAMIC_CONFIG_DIR: /dynamic
      APPAIFORGE_HARNESS_MODE: fake
      BIGQUERY_EMULATOR_HOST: bigquery-emulator:9050
      APPAIFORGE_FAKE_DELAY: "1.5"
      APPAIFORGE_MAX_SYSTEMS: "50"
      APPAIFORGE_HEALTH_INTERVAL: "5"
      APPAIFORGE_SEED_DEMO_ADMIN: "1"
    volumes:
      - ${APPAIFORGE_E2E_WORKSPACES_DIR:-/opt/appaiforge/workspaces-e2e}:/workspaces
      - ${APPAIFORGE_E2E_CONFIGS_DIR:-/opt/appaiforge/configs-e2e}:/configs
      - dynamic:/dynamic
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  default:
    name: appaiforge-e2e-net

volumes:
  pgdata:
  dynamic:
