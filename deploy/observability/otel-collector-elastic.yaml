# Config do OTel Collector pro profile `observability-elastic` (change
# agent-telemetry-backend-agnostic): recebe OTLP do portal/broker no mesmo
# endpoint fixo de sempre e repassa pro APM Server (traces e logs), que por
# sua vez indexa no Elasticsearch - exibido no Kibana. Mesma aplicação, zero
# mudança de código ou de endpoint: só este arquivo e qual profile está de
# pé mudam (ver otel-collector-tempo.yaml para o outro backend de exemplo).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

# Métricas (change portal-observability-otel, design D4): portal e broker
# exportam cumulativo (padrão do SDK, o que o Prometheus espera); a conversão
# para delta, que o APM Server trata melhor, fica aqui — particularidade do
# backend no Collector, nunca na aplicação (ADR 0025).
processors:
  cumulativetodelta: {}

exporters:
  otlp/apm:
    # APM Server do compose por padrão; um Elastic externo via
    # APM_SERVER_ENDPOINT (ver o serviço otel-collector-elastic no compose).
    endpoint: ${env:APM_SERVER_ENDPOINT}
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/apm]
    logs:
      receivers: [otlp]
      exporters: [otlp/apm]
    metrics:
      receivers: [otlp]
      processors: [cumulativetodelta]
      exporters: [otlp/apm]
