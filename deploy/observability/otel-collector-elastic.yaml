# Config do OTel Collector pro profile `observability-elastic` (change
# agent-telemetry-backend-agnostic): recebe OTLP do portal/broker no mesmo
# endpoint fixo de sempre e repassa pro APM Server (traces e logs), que por
# sua vez indexa no Elasticsearch - exibido no Kibana. Mesma aplicação, zero
# mudança de código ou de endpoint: só este arquivo e qual profile está de
# pé mudam (ver otel-collector-tempo.yaml para o outro backend de exemplo).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  otlp/apm:
    endpoint: apm-server:8200
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/apm]
    logs:
      receivers: [otlp]
      exporters: [otlp/apm]
