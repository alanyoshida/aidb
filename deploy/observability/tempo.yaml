# Tempo em modo single-binary: recebe traços OTLP do Collector (change
# agent-telemetry-backend-agnostic) — o Debug log do chat lê de uma tabela
# Postgres própria, não consulta este Tempo diretamente.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 48h
