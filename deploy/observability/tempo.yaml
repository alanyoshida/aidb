# Tempo em modo single-binary (etapa 6, change agent-telemetry-otel):
# recebe os traços OTLP do portal/broker (APPAIFORGE_OTEL_TRACES_ENDPOINT)
# e é consultado pelo Debug log do chat (APPAIFORGE_OTEL_TRACES_QUERY_URL).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 48h
