# Config do OTel Collector pro profile `observability` (change
# agent-telemetry-backend-agnostic): recebe OTLP do portal/broker num
# endpoint fixo e repassa pro Tempo (traces) e pro Loki (logs). Trocar de
# backend (ex.: pra Elasticsearch/Kibana, profile `observability-elastic`)
# é só usar o outro arquivo de config deste diretório — a aplicação nunca
# muda, ela sempre fala com o Collector no mesmo endpoint.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      exporters: [otlphttp/loki]
