# Loki em modo single-binary (etapa 6, change agent-telemetry-otel):
# recebe logs estruturados OTLP do portal (login, configuração de
# sistema, prompts, espelho da auditoria de gestão) via
# APPAIFORGE_OTEL_LOGS_ENDPOINT, no endpoint nativo /otlp/v1/logs.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
